name: Daily AI Short

on:
  schedule:
    - cron: "47 12 * * *"  # 12:47 UTC every day; off the hour, when GitHub delays scheduled runs
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube (needs SHORTS_UPLOADER=youtube and the YouTube secrets)"
        type: boolean
        default: true

permissions:
  contents: write  # to save state (already-aired stories, monthly LLM spend) on the `state` branch

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install ".[all]"

      # Stories that already aired and the month's LLM spend live on the `state` branch.
      - name: Load state
        id: load
        run: |
          mkdir -p state
          # No branch yet (exit code 2) means a first run. Any other git error stops here, so the
          # save step below can't replace good state with an empty one.
          status=0
          git ls-remote --exit-code --heads origin state >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth 1 origin state
            git archive FETCH_HEAD | tar -x -C state
          elif [ "$status" -ne 2 ]; then
            echo "::error::could not read the state branch (git exit code $status)"
            exit "$status"
          fi

      - name: Make the episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX: ${{ vars.AGENTMAIL_INBOX }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SHORTS_LLM_MODEL: ${{ vars.SHORTS_LLM_MODEL }}
          SHORTS_EDITOR_MODEL: ${{ vars.SHORTS_EDITOR_MODEL }}
          SHORTS_WRITER_MODEL: ${{ vars.SHORTS_WRITER_MODEL }}
          SHORTS_CHECKER_MODEL: ${{ vars.SHORTS_CHECKER_MODEL }}
          SHORTS_AGENTS: ${{ vars.SHORTS_AGENTS }}
          SHORTS_MAX_REPAIRS: ${{ vars.SHORTS_MAX_REPAIRS }}
          SHORTS_BUDGET_USD: ${{ vars.SHORTS_BUDGET_USD }}
          SHORTS_MONTHLY_BUDGET_USD: ${{ vars.SHORTS_MONTHLY_BUDGET_USD }}
          SHORTS_NOTIFY_EMAIL: ${{ vars.SHORTS_NOTIFY_EMAIL }}
          SHORTS_UPLOADER: ${{ vars.SHORTS_UPLOADER || 'local' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: python -m shorts run $([ "$UPLOAD" = "true" ] && echo --upload)

      - name: Save state
        # A failed run still spent money, so the monthly cap must count it.
        if: always() && steps.load.outcome == 'success'
        run: |
          cd state
          [ -n "$(ls -A)" ] || exit 0
          git init -q -b state
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "state after run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode
          path: |
            output/*/short.mp4
            output/*/*.json
            output/*/captions.ass
          if-no-files-found: ignore
